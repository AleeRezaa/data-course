name: Validate JSON

on:
  pull_request:
    paths: ["**.json"]
  push:
    branches: [main]
    paths: ["**.json"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every JSON file
        run: |
          python3 - <<'PY'
          import json, sys, glob

          files = [f for f in sorted(glob.glob("**/*.json", recursive=True)) if "node_modules/" not in f]
          errors = []
          for path in files:
              try:
                  with open(path, encoding="utf-8") as fh:
                      json.load(fh)
              except Exception as e:
                  errors.append((path, str(e)))
                  print(f"::error file={path}::Invalid JSON: {e}")

          print(f"checked {len(files)} JSON file(s); {len(errors)} invalid")
          sys.exit(1 if errors else 0)
          PY
